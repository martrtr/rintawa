[workspace]
resolver = "3"

members = [
    "crates/*",
    "tools/*",
    "apps/*",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/martrtr/rintawa"
authors = ["martrtr"]
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
ignore = "0.4"
thiserror = "2"
tempfile = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

tracing = "0.1"
tracing-subscriber = "0.3"

toml = "0.9"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
wasmtime = { version = "29", features = ["component-model", "async"] }
