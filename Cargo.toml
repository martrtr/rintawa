[workspace]
resolver = "2"

members = [
    "crates/*",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/martrtr/rintawa"
authors = ["martrtr"]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = "0.3"

toml = "0.9"
wasmtime = { version = "29", features = ["component-model", "async"] }