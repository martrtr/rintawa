[package]
name = "rintawa-world-system-fixture"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[profile.dev]
debug = 0
strip = "symbols"
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "=0.57.1"
