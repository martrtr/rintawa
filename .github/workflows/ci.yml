name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      
      - name: Verify workspace
        run: bash scripts/check.sh
